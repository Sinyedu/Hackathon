name: Deploy frontend (Vercel)

# Runs only after CI succeeds on main. Needs three repository secrets (see docs/CI-CD.md);
# without them the job passes and skips the deploy instead of failing.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (production)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Vercel secrets not set; skipping deploy (see docs/CI-CD.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
      # Run from the repo root: the Vercel project's Root Directory is `frontend`.
      # `vercel pull` cannot download variables marked "Sensitive" (it writes the placeholder
      # [SENSITIVE]), so VITE_API_URL comes from the GitHub repository variable of the same name.
      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          if [ -n "$VITE_API_URL" ]; then
            sed -i '/^VITE_API_URL=/d' .vercel/.env.production.local
          fi
          if grep -q '^VITE_API_URL=.*\[SENSITIVE\]' .vercel/.env.production.local; then
            echo "::error::VITE_API_URL is a Sensitive Vercel variable and cannot be pulled. Add a GitHub repository variable VITE_API_URL (Settings > Secrets and variables > Actions > Variables) or make the Vercel variable non-sensitive."
            exit 1
          fi
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
